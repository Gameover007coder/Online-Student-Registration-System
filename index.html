<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Online Student Registration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="board">

    <header class="board__header">
      <p class="eyebrow">CLASSROOM No. 07 &middot; ACADEMIC REGISTER</p>
      <h1 class="chalk-title">Online Student Registration</h1>
      <svg class="underline" viewBox="0 0 420 20" preserveAspectRatio="none" aria-hidden="true">
        <path d="M2 14 C 80 4, 160 18, 210 10 S 340 2, 418 12" />
      </svg>
    </header>

    <main class="panels">

      <!-- ENROLLMENT FORM -->
      <section class="panel form-panel" aria-labelledby="enroll-heading">
        <h2 id="enroll-heading" class="panel-title">Enroll a Student</h2>

        <form id="reg-form" novalidate>
          <div class="field">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" name="fullName" placeholder="e.g. Ananya Sharma" required />
          </div>

          <div class="field-row">
            <div class="field">
              <label for="rollNo">Roll number</label>
              <input type="text" id="rollNo" name="rollNo" placeholder="e.g. 2026-CS-014" required />
            </div>
            <div class="field">
              <label for="course">Course / class</label>
              <select id="course" name="course" required>
                <option value="" disabled selected>Choose one</option>
                <option>Computer Science</option>
                <option>Commerce</option>
                <option>Arts &amp; Humanities</option>
                <option>Science</option>
                <option>Mathematics</option>
                <option>Other</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" placeholder="student@example.com" required />
          </div>

          <div class="field">
            <label for="phone">Phone number <span class="optional">(optional)</span></label>
            <input type="tel" id="phone" name="phone" placeholder="e.g. +91 98765 43210" />
          </div>

          <button type="submit" id="submit-btn" class="chalk-btn">
            <span class="btn-label">Enroll student</span>
          </button>

          <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <!-- LIVE REGISTER -->
      <section class="panel register-panel" aria-labelledby="register-heading">
        <div class="register-panel__head">
          <h2 id="register-heading" class="panel-title">Class Register</h2>
          <span id="student-count" class="count-tag">0 enrolled</span>
        </div>

        <div class="table-wrap">
          <table class="ledger" id="ledger-table">
            <thead>
              <tr>
                <th class="col-num">#</th>
                <th>Name</th>
                <th>Roll No.</th>
                <th>Course</th>
                <th>Enrolled</th>
                <th class="col-action"></th>
              </tr>
            </thead>
            <tbody id="ledger-body">
              <!-- rows injected by script.js -->
            </tbody>
          </table>

          <div id="empty-state" class="empty-state">
            <p>No chalk marks yet.</p>
            <p class="empty-state__sub">The first student you enroll will show up here, live.</p>
          </div>
        </div>
      </section>

    </main>

    <footer class="board__footer">
      <p id="connection-note">Connecting to the register…</p>
    </footer>
  </div>

  <!-- Firebase (compat SDKs — simplest to drop into a static page) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="firebase-config.js"></script>
  <script src="script.js"></script>
</body>
</html>
